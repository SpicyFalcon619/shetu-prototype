<!doctype html><html><head><meta charset="utf-8"><title>Shetu prototype</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{--ink:#222023;--teal:#BF092F;--teal-d:#BF092F;--mint:#FBE6EA;--coral:#BF092F;--coral-l:#FBE6EA;--sun:#D99A1E;--sun-l:#FBF0D8;--lav:#8C0622;--lav-l:#F1E9DC;
--paper:#F8F4EC;--bg:#F8F4EC;--line:#E8DFD2;--muted:#6B6366;--green:#2E9E5B;--green-l:#E1F5E9;--rose:#F2B8C3;--purple:#BF092F}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
h1{font:800 26px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
h2{font:800 19px/1.2 "Bricolage Grotesque",sans-serif}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.k{font:800 11px/1 "Plus Jakarta Sans";letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-green{background:var(--green)}.d-amber{background:var(--sun)}.d-red{background:var(--coral)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 15px;font:700 13px "Plus Jakarta Sans";background:var(--teal);color:#fff;cursor:pointer}
.btn.g{background:#EEF1F6;color:var(--muted)}.btn.done{background:var(--green)}
.btn svg{width:15px;height:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:8px 8px;font-weight:800}
td{padding:11px 8px;border-top:1px solid var(--line);vertical-align:middle}
.demo{font-size:11.5px;color:var(--muted)}
.bar{height:8px;border-radius:6px;background:#EEF1F6;overflow:hidden}.bar>span{display:block;height:100%;border-radius:6px}
</style></head>
<body style="background:linear-gradient(170deg,#2A1E3D 0%,#BF092F 45%,#C77DA0 75%,#F2B07A 92%,#FBCF4F 100%);min-height:100vh;display:grid;place-items:center;color:#fff">
<div style="text-align:center;padding:30px"><img src="./static/shetu_logo_white.png" style="height:110px">
<h1 style="font-size:42px;margin-top:22px">Keep the people you trained.</h1><p style="color:#F8F4EC;margin-top:8px">Prototype · demo data · AI outputs generated offline on our laptop</p>
<div style="display:flex;gap:16px;justify-content:center;margin-top:30px;flex-wrap:wrap">
<a href="./me/" class="card" style="width:280px;text-align:left;color:var(--ink)"><p class="k" style="color:var(--teal-d)">Employee</p><h2 style="margin-top:6px">I'm going on leave</h2><p class="sub">Nusrat's app: Map, Hold, Fit</p></a>
<a href="./employer/" class="card" style="width:280px;text-align:left;color:var(--ink)"><p class="k" style="color:var(--teal-d)">Employer</p><h2 style="margin-top:6px">HR and managers</h2><p class="sub">All leaves, case view, team capacity, report</p></a>
</div></div></body></html>
